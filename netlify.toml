# Netlify — full deployment for LexIndia AI.
#
# Build (Linux, offline): install server + web deps, build the SQLite
# knowledge base from the committed caches, build the Vite client.
# API: /api/* is handled by the serverless function netlify/functions/api.js
# (Express app via serverless-http, node:sqlite, prebuilt legal.db bundled).
# Static assets are served by Netlify; anything unknown falls back to the SPA.

[build]
  command = "npm --prefix server ci --no-fund --no-audit && npm --prefix web ci --no-fund --no-audit && node server/src/ingest/pipeline.js --skip-network && npm --prefix web run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  included_files = ["data/legal.db"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback: static assets still win over this; anything unknown
# (refresh, direct navigation) lands on the client shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
