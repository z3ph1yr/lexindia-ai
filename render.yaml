# Render.com Blueprint — one-click deploy for LexIndia AI.
# Push this repo to GitHub, then in Render: New → Blueprint → select the repo.
# The SQLite knowledge base is built during the build step (offline caches)
# and lives at <repo>/data/legal.db. No persistent disk (not supported on the
# free tier): if the ephemeral filesystem is wiped on restart, the server
# rebuilds the database offline from the committed caches before listening.
services:
  - type: web
    name: lexindia-ai
    runtime: node
    plan: free
    buildCommand: npm --prefix server ci --no-fund --no-audit && npm --prefix web ci --no-fund --no-audit && node server/src/ingest/pipeline.js --skip-network && npm --prefix web run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: ">=22"
      # Optional: set these in the Render dashboard to enable LLM synthesis.
      # LLM_API_KEY / LLM_MODEL / LLM_BASE_URL — never commit them here.
